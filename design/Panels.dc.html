<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget options panels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#dddddd}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 56px 64px; font-family: 'Inter', -apple-system, sans-serif; color: #ffffff; background: radial-gradient(circle at 12% 20%, #ff7a59 0, rgba(255,122,89,0) 40%), radial-gradient(circle at 88% 30%, #7b5cff 0, rgba(123,92,255,0) 46%), radial-gradient(circle at 50% 100%, #1fb5ff 0, rgba(31,181,255,0) 46%), #1b1530; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px; align-items: start">

  <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 12px; width: 336px">
      <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px">
        <span style="font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.7)">{{c.num}}</span>
        <span style="font-size: 20px; font-weight: 600">{{c.title}}</span>
      </div>

      <div style="box-sizing: border-box; padding: 16px 18px 18px; border-radius: 30px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.38); box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); backdrop-filter: blur(30px) saturate(180%); display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"></path></svg>
            <span style="font-size: 15px; font-weight: 600">Focus</span>
          </div>
          <div style="display: flex; gap: 6px">
            <span style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: {{c.b1}}; color: {{c.f1}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg></span>
            <span style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: {{c.b2}}; color: {{c.f2}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></span>
            <span style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: {{c.b3}}; color: {{c.f3}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.5-1-2 0-3 .8-.8 2-.5 3-.5a4 4 0 0 0 4-4C21 7 17 3 12 3z"></path><circle cx="7.5" cy="11" r="1.2"></circle><circle cx="11" cy="7.5" r="1.2"></circle><circle cx="15.5" cy="8.5" r="1.2"></circle></svg></span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 60px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums">18:42</span>
          <span style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #111111"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
          <div style="flex: 1; height: 8px; border-radius: 4px; position: relative; overflow: hidden; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 2px, rgba(0,0,0,0) 2px 6px)">
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 25%; border-radius: 4px; background: #ffffff"></div>
          </div>
          <span style="font-size: 12px; color: rgba(255,255,255,0.78)">2 / 4</span>
        </div>
      </div>

      <sc-if value="{{c.isTime}}" hint-placeholder-val="{{ true }}">
        <div style="box-sizing: border-box; padding: 18px; border-radius: 26px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.38); box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); backdrop-filter: blur(30px) saturate(180%); display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Edit time</span><button style="border: none; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.18); color: #ffffff">Done</button></div>
          <sc-for list="{{durations}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{r.label}}</span><span style="font-size: 12px; color: rgba(255,255,255,0.78)">{{r.hint}}</span></div>
              <div style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 16px; background: rgba(255,255,255,0.18)">
                <button aria-label="Decrease" style="width: 28px; height: 28px; border-radius: 14px; border: none; background: rgba(0,0,0,0); color: #ffffff; font-size: 16px">−</button>
                <span style="min-width: 46px; text-align: center; font-size: 14px; font-weight: 600">{{r.value}}</span>
                <button aria-label="Increase" style="width: 28px; height: 28px; border-radius: 14px; border: none; background: rgba(0,0,0,0); color: #ffffff; font-size: 16px">+</button>
              </div>
            </div>
          </sc-for>
          <div style="display: flex; gap: 6px">
            <button style="flex: 1; border: none; padding: 8px 0; border-radius: 12px; font-size: 13px; font-weight: 600; background: #ffffff; color: #111111">25 / 5</button>
            <button style="flex: 1; border: none; padding: 8px 0; border-radius: 12px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.18); color: #ffffff">50 / 10</button>
            <button style="flex: 1; border: none; padding: 8px 0; border-radius: 12px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.18); color: #ffffff">90 / 20</button>
          </div>
          <label style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">Auto-start next session
            <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #ffffff">
          </label>
        </div>
      </sc-if>

      <sc-if value="{{c.isMusic}}" hint-placeholder-val="{{ false }}">
        <div style="box-sizing: border-box; padding: 18px; border-radius: 26px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.38); box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); backdrop-filter: blur(30px) saturate(180%); display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Focus music</span><button style="border: none; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.18); color: #ffffff">Done</button></div>
          <div style="display: flex; padding: 3px; border-radius: 14px; background: rgba(255,255,255,0.18)">
            <button style="flex: 1; border: none; padding: 7px 0; border-radius: 11px; font-size: 13px; font-weight: 600; background: #ffffff; color: #111111">YouTube Music</button>
            <button style="flex: 1; border: none; padding: 7px 0; border-radius: 11px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,0); color: #ffffff">Spotify</button>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.78)">Paste a playlist, album or track link
            <input type="text" placeholder="music.youtube.com/playlist?list=…" style="border: 1px solid rgba(255,255,255,0.38); border-radius: 12px; padding: 9px 12px; font-size: 13px; background: rgba(255,255,255,0.18); color: #ffffff; outline: none">
          </label>
          <span style="font-size: 12px; color: rgba(255,255,255,0.78)">Quick picks</span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{tracks}}" as="k" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 12px; background: {{k.bg}}">
                <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">{{k.name}}</span><span style="font-size: 11px; color: rgba(255,255,255,0.78)">{{k.meta}}</span></span>
                <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.78)">{{k.state}}</span>
              </div>
            </sc-for>
          </div>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,0.78)">Volume
            <input type="range" min="0" max="100" value="60" style="flex: 1; accent-color: #ffffff">
          </label>
        </div>
      </sc-if>

      <sc-if value="{{c.isTheme}}" hint-placeholder-val="{{ false }}">
        <div style="box-sizing: border-box; padding: 18px; border-radius: 26px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.38); box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5); backdrop-filter: blur(30px) saturate(180%); display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Template</span><button style="border: none; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.18); color: #ffffff">Done</button></div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{templates}}" as="x" hint-placeholder-count="9">
              <div style="display: flex; flex-direction: column; gap: 5px">
                <span style="height: 58px; border-radius: 14px; box-sizing: border-box; padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; background: {{x.bg}}; color: {{x.text}}; border: 1px solid {{x.border}}; outline: {{x.ring}}; outline-offset: 2px">
                  <span style="font-family: {{x.font}}; font-size: 17px; font-weight: 600">25:00</span>
                  <span style="height: 4px; width: 60%; border-radius: 2px; background: {{x.accent}}"></span>
                </span>
                <span style="font-size: 11px; font-weight: 500; text-align: center">{{x.name}}</span>
              </div>
            </sc-for>
          </div>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,0.78)">Glass opacity
            <input type="range" min="0" max="100" value="30" style="flex: 1; accent-color: #ffffff">
          </label>
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var TPL = [
  {name:'Liquid Glass', bg:'rgba(255,255,255,0.14)', border:'rgba(255,255,255,0.38)', text:'#ffffff', accent:'#ffffff', font:"'Inter', sans-serif"},
  {name:'Ember', bg:'linear-gradient(165deg, #8a2f12 0%, #3b0e05 100%)', border:'rgba(255,140,90,0.35)', text:'#ffffff', accent:'#ff5a1f', font:"'Inter', sans-serif"},
  {name:'Forest', bg:'linear-gradient(165deg, #1f5216 0%, #0a1c07 100%)', border:'rgba(120,220,90,0.3)', text:'#ffffff', accent:'#46e02a', font:"'Inter', sans-serif"},
  {name:'Tide', bg:'linear-gradient(165deg, #1a3f94 0%, #0a1538 100%)', border:'rgba(120,160,255,0.35)', text:'#ffffff', accent:'#3b82ff', font:"'Inter', sans-serif"},
  {name:'Tangerine', bg:'#ff8a1a', border:'rgba(0,0,0,0.1)', text:'#111111', accent:'#111111', font:"'Inter', sans-serif"},
  {name:'Sunny', bg:'#ffd60a', border:'rgba(0,0,0,0.1)', text:'#111111', accent:'#111111', font:"'Inter', sans-serif"},
  {name:'Paper', bg:'#f5f4ef', border:'rgba(0,0,0,0.08)', text:'#111111', accent:'#e8331b', font:"'Inter', sans-serif"},
  {name:'Pixel', bg:'#c5d0a0', border:'rgba(37,51,26,0.3)', text:'#25331a', accent:'#25331a', font:"'VT323', monospace"},
  {name:'Midnight', bg:'#050505', border:'rgba(255,255,255,0.14)', text:'#ffffff', accent:'#ff2d2d', font:"'Inter', sans-serif"}
];
class Component extends DCLogic {
  renderVals() {
    var on = '#ffffff', off = 'rgba(255,255,255,0.18)';
    function col(num, title, which) {
      return { num: num, title: title, isTime: which === 1, isMusic: which === 2, isTheme: which === 3,
        b1: which === 1 ? on : off, f1: which === 1 ? '#111111' : '#ffffff',
        b2: which === 2 ? on : off, f2: which === 2 ? '#111111' : '#ffffff',
        b3: which === 3 ? on : off, f3: which === 3 ? '#111111' : '#ffffff' };
    }
    return {
      cols: [col('01', 'Edit time', 1), col('02', 'Focus music', 2), col('03', 'Template', 3)],
      durations: [
        { label: 'Focus', hint: 'Deep work block', value: '25 min' },
        { label: 'Short break', hint: 'After each focus', value: '5 min' },
        { label: 'Long break', hint: 'Every 4 rounds', value: '15 min' },
        { label: 'Rounds', hint: 'Before a long break', value: '4' }
      ],
      tracks: [
        { name: 'Lofi Focus Radio', meta: 'YouTube Music · live', state: 'Playing', bg: 'rgba(255,255,255,0.18)' },
        { name: 'Deep Focus Piano', meta: 'YouTube Music · playlist', state: 'Play', bg: 'rgba(0,0,0,0)' },
        { name: 'Rain on a Window', meta: 'YouTube Music · 3 h', state: 'Play', bg: 'rgba(0,0,0,0)' },
        { name: 'Brown Noise', meta: 'YouTube Music · 10 h', state: 'Play', bg: 'rgba(0,0,0,0)' }
      ],
      templates: TPL.map(function (x, i) { return Object.assign({}, x, { ring: i === 0 ? '2px solid #ffffff' : '2px solid rgba(0,0,0,0)' }); })
    };
  }
}
</script>
</body>
</html>
